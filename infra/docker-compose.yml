services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: findb
    ports:
      # Mantém acesso para desenvolvimento local sem Docker.
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d findb"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: spend-control-backend:local
    build:
      context: ../backend
    ports:
      - "127.0.0.1:${API_PORT:-3333}:3333"
    environment:
      DATABASE_URL: postgresql://admin:adminpassword@db:5432/findb
      PORT: "3333"
      CORS_ORIGIN: http://localhost:${FRONTEND_PORT:-8080},http://127.0.0.1:${FRONTEND_PORT:-8080},http://localhost:5173
      JWT_SECRET: ${JWT_SECRET:-local-development-only-change-me}
      PLUGGY_MOCK: "1"
    depends_on:
      db:
        condition: service_healthy
    # Healthcheck vem da imagem (ver HEALTHCHECK no backend/Dockerfile) — sem duplicar aqui.

  frontend:
    image: spend-control-frontend:local
    build:
      context: ../frontend
      args:
        # A API é acessada pelo navegador, fora da rede do Compose.
        VITE_API_URL: http://localhost:${API_PORT:-3333}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
