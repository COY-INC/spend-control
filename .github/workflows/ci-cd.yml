name: CI/CD

on:
  push:
    branches: ["**"] # só branches: push de tag (ex.: v1.1.0 manual) não roda o pipeline
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Na main não cancela: um push para o Docker Hub não pode ser interrompido no meio.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  BACKEND_IMAGE: spend-control-backend:${{ github.sha }}
  FRONTEND_IMAGE: spend-control-frontend:${{ github.sha }}

jobs:
  build:
    name: Build (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [frontend, backend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install dependencies
        id: install
        working-directory: ${{ matrix.package }}
        run: npm ci

      - name: Generate Prisma Client
        if: matrix.package == 'backend'
        id: prisma-generate
        working-directory: backend
        run: npx prisma generate

      - name: Lint
        if: matrix.package == 'frontend'
        id: lint
        working-directory: frontend
        run: npm run lint

      - name: Build application
        id: build
        working-directory: ${{ matrix.package }}
        run: npm run build

      - name: Summarize failure
        if: failure()
        run: |
          echo "## ❌ Build falhou (${{ matrix.package }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.install.outcome }}" = "failure" ]; then
            echo "- **Install dependencies** falhou (\`npm ci\` em \`${{ matrix.package }}/\`). Causa provável: dependência ausente/incompatível ou lockfile desatualizado. Veja o log do passo acima para o erro exato." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.prisma-generate.outcome }}" = "failure" ]; then
            echo "- **Generate Prisma Client** falhou (\`npx prisma generate\`). Causa provável: erro de sintaxe no \`schema.prisma\`. Veja o log do passo acima para o erro exato." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.lint.outcome }}" = "failure" ]; then
            echo "- **Lint** falhou (\`npm run lint\` em \`frontend/\`). Causa provável: regra do oxlint violada. Veja o log do passo acima para o arquivo e a linha." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.build.outcome }}" = "failure" ]; then
            echo "- **Build application** falhou (\`npm run build\` em \`${{ matrix.package }}/\`). Causa provável: erro de compilação/tipagem TypeScript. Veja o log do passo acima para o erro exato." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Os testes não rodam enquanto o build não passar. Abra a aba **Actions** > este workflow > o passo marcado com ❌ para o log completo." >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Test (${{ matrix.package }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [frontend, backend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install dependencies
        id: install
        working-directory: ${{ matrix.package }}
        run: npm ci

      - name: Generate Prisma Client
        if: matrix.package == 'backend'
        id: prisma-generate
        working-directory: backend
        run: npx prisma generate

      - name: Run unit tests
        id: test
        working-directory: ${{ matrix.package }}
        env:
          CI: true
        run: npm test

      - name: Summarize failure
        if: failure()
        run: |
          echo "## ❌ Testes falharam (${{ matrix.package }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.install.outcome }}" = "failure" ]; then
            echo "- **Install dependencies** falhou (\`npm ci\` em \`${{ matrix.package }}/\`). Causa provável: dependência ausente/incompatível ou lockfile desatualizado. Veja o log do passo acima para o erro exato." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.prisma-generate.outcome }}" = "failure" ]; then
            echo "- **Generate Prisma Client** falhou (\`npx prisma generate\`). Causa provável: erro de sintaxe no \`schema.prisma\`. Veja o log do passo acima para o erro exato." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.test.outcome }}" = "failure" ]; then
            echo "- **Run unit tests** falhou (\`npm test\` em \`${{ matrix.package }}/\`). Causa provável: um ou mais testes quebraram. Veja o log do passo acima para o teste e a mensagem de erro." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Abra a aba **Actions** > este workflow > o passo marcado com ❌ para o log completo." >> "$GITHUB_STEP_SUMMARY"

  docker:
    name: Docker (build & validate)
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: infra/docker-compose.yml

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Compose builda as imagens spend-control-{backend,frontend}:local com os mesmos
      # build args do uso local, com valores de teste de infra/.env.example.
      - name: Build images
        id: build
        run: docker compose --env-file infra/.env.example build

      - name: Start stack
        id: up
        run: docker compose --env-file infra/.env.example up -d --no-build --wait --wait-timeout 180

      - name: Check API /health
        id: health
        run: curl -fsS --retry 5 --retry-delay 3 --retry-all-errors http://localhost:3333/health

      - name: Check frontend
        id: frontend
        run: curl -fsS -o /dev/null http://localhost:8080/

      - name: Show container logs
        if: failure() && steps.up.outcome != 'skipped'
        run: docker compose --env-file infra/.env.example logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose --env-file infra/.env.example down -v

      # Mesma imagem validada acima, só com a tag rastreável do commit.
      - name: Tag images with commit SHA
        run: |
          docker tag spend-control-backend:local "$BACKEND_IMAGE"
          docker tag spend-control-frontend:local "$FRONTEND_IMAGE"

      # Só o CD (push na main) consome o artefato; nas demais branches/PRs não gasta storage.
      - name: Save images
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: docker save --output images.tar "$BACKEND_IMAGE" "$FRONTEND_IMAGE"

      - name: Upload images artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: images-${{ github.sha }}
          path: images.tar
          retention-days: 7

      - name: Summarize failure
        if: failure()
        run: |
          echo "## ❌ Validação Docker falhou" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.build.outcome }}" = "failure" ]; then
            echo "- **Build images** falhou (\`docker compose --env-file infra/.env.example build\`). Causa provável: erro em um Dockerfile ou no build da aplicação dentro dele." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.up.outcome }}" = "failure" ]; then
            echo "- **Start stack** falhou (\`docker compose --env-file infra/.env.example up --wait\`). Algum container não ficou \`healthy\` — veja o passo **Show container logs**." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.frontend.outcome }}" = "failure" ]; then
            echo "- **Check frontend** falhou. O Nginx não respondeu 200 em \`http://localhost:8080/\` — veja o passo **Show container logs**." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.health.outcome }}" = "failure" ]; then
            echo "- **Check API /health** falhou. A API subiu mas não respondeu 200 em \`/health\` (banco inacessível?) — veja o passo **Show container logs**." >> "$GITHUB_STEP_SUMMARY"
          fi

  cd:
    name: CD (publish Docker Hub)
    needs: [build, test, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # criar a tag de versão no repositório

    steps:
      # Histórico completo + tags, para calcular a próxima versão.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Incrementa o patch da última tag vX.Y.Z (primeira: v1.0.0). Se o commit já tem
      # uma tag de versão (re-run do job), reaproveita. Para subir minor/major, crie a
      # tag manualmente (ex.: v1.1.0) — as próximas continuam a partir dela.
      - name: Compute version
        id: version
        run: |
          current=$(git tag --points-at HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -n "$current" ]; then
            version="${current#v}"
          else
            last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
            if [ -z "$last" ]; then
              version="1.0.0"
            else
              IFS=. read -r major minor patch <<< "${last#v}"
              version="$major.$minor.$((patch + 1))"
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Versão: v$version"

      # Reaproveita a imagem validada pelo job docker — o CD nunca rebuilda.
      - name: Download images artifact
        uses: actions/download-artifact@v4
        with:
          name: images-${{ github.sha }}

      - name: Load images
        run: docker load --input images.tar

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag e push das imagens
        env:
          REGISTRY_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for image in "$BACKEND_IMAGE" "$FRONTEND_IMAGE"; do
            repo="$REGISTRY_USER/${image%%:*}"
            # A versão é rastreável: X.Y.Z -> tag git vX.Y.Z -> commit do merge.
            for tag in "$VERSION" latest; do
              docker tag "$image" "$repo:$tag"
              docker push "$repo:$tag"
            done
            echo "- \`$repo:$VERSION\` e \`$repo:latest\` (commit \`${{ github.sha }}\`)" >> "$GITHUB_STEP_SUMMARY"
          done

      # Só depois do push: a tag no git garante que a versão existe no Docker Hub.
      # Tags criadas com o GITHUB_TOKEN não disparam novos workflows (sem loop).
      - name: Create git tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "Tag v$VERSION já existe neste commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION" "${{ github.sha }}"
          git push origin "v$VERSION"
          echo "- Tag git \`v$VERSION\` criada em \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
