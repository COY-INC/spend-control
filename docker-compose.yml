name: spend-control
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adminpassword}
      POSTGRES_DB: ${POSTGRES_DB:-findb}
    ports:
    - 127.0.0.1:${DB_PORT:-5433}:5432
    volumes:
    - db-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    image: spend-control-backend:local
    build:
      context: ./backend
    ports:
    - 127.0.0.1:${API_PORT:-3333}:3333
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://admin:adminpassword@db:5432/findb}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET:-local-development-only-change-me}
      PLUGGY_MOCK: ${PLUGGY_MOCK:-1}
      PORT: '3333'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - 'fetch(''http://127.0.0.1:3333/health'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
  frontend:
    image: spend-control-frontend:local
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3333}
    ports:
    - 127.0.0.1:${FRONTEND_PORT:-8080}:8080
    depends_on:
      backend:
        condition: service_healthy
volumes:
  db-data: null
